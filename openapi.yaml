      type: object
      properties:
        nodeId:
          type: string
        actuatorName:
          type: string
    DecisionRuleSchedule:
      type: object
      nullable: true
      properties:
        cron:
          type: string
          nullable: true
        intervalSeconds:
          type: integer
          format: int64
          nullable: true
    DecisionRuleEvaluationMethod:
      type: string
      enum:
      - expression
      - externalService
      - undefined
    DecisionRuleTriggerType:
      type: string
      enum:
      - manual
      - temporal
      - event
    DecisionRule:
      type: object
      properties:
        ruleId:
          type: string
          example: rule-0001
        description:
          type: string
          nullable: true
          description: Brief description of the rule.
        triggerType:
          $ref: '#/components/schemas/DecisionRuleTriggerType'
        schedule:
          $ref: '#/components/schemas/DecisionRuleSchedule'
        eventSource:
          type: string
          nullable: true
        evaluationMethod:
          $ref: '#/components/schemas/DecisionRuleEvaluationMethod'
        expression:
          type: string
          nullable: true
          description: Logical condition that triggers the rule.
          example: (H1 + H2)/2 > 60 && T1 < 22
        externalServiceUrl:
          type: string
          nullable: true
          description: External service URL that triggers the rule.
        variables:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: Map of variable alias to actual sensor IDs.
          example:
            H1: H1
            H2: H2
            T1: T1
        sensors:
          type: array
          items:
            $ref: '#/components/schemas/DecisionSensorRef'
        actuators:
          type: array
          items:
            $ref: '#/components/schemas/DecisionActuatorRef'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/DecisionAction'
