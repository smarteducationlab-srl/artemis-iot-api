        receivedAt:
          $ref: '#/components/schemas/Timestamp'
      required:
      - status
      - id
      - receivedAt
      example:
        status: ok
        id: hb_01JFQ8E6E9ZP5X6N9K2Q8C
        receivedAt: '2026-04-09T12:00:00Z'
    DataAck:
      type: object
      properties:
        status:
          type: string
          example: ok
        id:
          type: string
          description: Internal record ID
        receivedAt:
          $ref: '#/components/schemas/Timestamp'
      required:
      - status
      - id
      - receivedAt
      example:
        status: ok
        id: rec_01JFQ8E6E9ZP5X6N9K2Q8C
        receivedAt: '2025-09-10T10:15:12Z'
    ScalarIn:
      type: object
      additionalProperties: false
      properties:
        sensorId:
          type: string
          description: Optional sensor discriminator within the node
        value:
          type: number
          description: Numeric value
        timestamp:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          description: Optional measurement timestamp; if omitted in MQTT ingestion,
            the platform may use ingestion time.
      required:
      - value
    SpatialIn:
      type: object
      additionalProperties: false
      properties:
        sensorId:
          type: string
          description: Optional sensor discriminator within the node
        x:
          type: number
        y:
          type: number
        z:
          type: number
        timestamp:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          description: Optional measurement timestamp; if omitted in MQTT ingestion,
            the platform may use ingestion time.
      required:
      - x
      - y
      - z
    VectorIn:
      type: object
      additionalProperties: false
      properties:
        sensorId:
          type: string
          description: Optional sensor discriminator within the node
        vector:
          type: array
          items:
            type: number
        timestamp:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          description: Optional measurement timestamp; if omitted in MQTT ingestion,
            the platform may use ingestion time.
      required:
      - vector
    TemporalIn:
      type: object
      additionalProperties: false
      properties:
        sensorId:
          type: string
          description: Optional sensor discriminator within the node
        series:
          type: array
          items:
            type: object
            properties:
              timestamp:
                $ref: '#/components/schemas/Timestamp'
              value:
                type: number
            required:
            - timestamp
            - value
      required:
      - series
    MultimediaIn:
      type: object
      additionalProperties: false
      properties:
        sensorId:
          type: string
          description: Optional sensor discriminator within the node
        file:
          type: string
          format: binary
          description: Media file (photo/video)
    LatestData:
      type: object
      description: Latest datapoint wrapper returned by the data-service.
      properties:
        payload:
          type: object
          additionalProperties: true
      required:
      - payload
      example:
        payload:
          value: 23.4
          sensorId: temp-1
          timestamp: '2026-03-26T10:15:30Z'
          _type: scalar
          _receivedAt: '2026-03-26T10:15:31Z'
    QueryResult:
      type: object
      description: Query results for non-media types.
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              nodeId:
                type: string
              type:
                type: string
              receivedAt:
                $ref: '#/components/schemas/Timestamp'
              payload:
                type: object
                additionalProperties: true
            required:
            - id
            - nodeId
            - type
            - receivedAt
            - payload
      required:
      - data
      example:
        data:
        - id: rec_01JFQ8E6E9ZP5X6N9K2Q8C
          nodeId: node_ab12cd34ef
          type: scalar
          receivedAt: '2026-03-26T10:15:31Z'
          payload:
            value: 22.9
            sensorId: temp-1
            timestamp: '2026-03-26T10:15:30Z'
        - id: rec_01JFQ8E6E9ZP5X6N9K2Q8D
          nodeId: node_ab12cd34ef
          type: scalar
          receivedAt: '2026-03-26T10:16:31Z'
          payload:
            value: 23.1
            sensorId: temp-1
            timestamp: '2026-03-26T10:16:30Z'
