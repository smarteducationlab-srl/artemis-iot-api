                  reason: Manual override from control room
                  timestamp: '2025-09-10T10:15:12Z'
              setValue:
                summary: Numeric actuator command
                value:
                  actuatorName: ventilation-fan
                  commandType: setValue
                  value: 75
                  unit: '%'
                  reason: Partial activation due to ventilation regulation
                  timestamp: '2025-09-10T10:15:12Z'
      responses:
        '200':
          description: Command successfully sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commands'
              example:
                issuedBy: user-0001
                actuatorName: ventilation-fan
                commandType: setState
                state: on
                reason: Manual override from control room
                message: Command delivered
                timestamp: '2025-09-10T10:15:12Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags:
      - Actuator Commands
      summary: Get Last Command
      description: Returns the last command that was sent to a specific actuator.
      security:
      - bearerIndigo: []
      parameters:
      - $ref: '#/components/parameters/ActuatorNameFilter'
      - $ref: '#/components/parameters/NodeId'
      responses:
        '200':
          description: Last command successfully returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commands'
              example:
                issuedBy: user-0001
                actuatorName: ventilation-fan
                commandType: setValue
                value: 75
                unit: '%'
                reason: Partial activation due to ventilation regulation
                message: Command delivered
                timestamp: '2025-09-10T10:15:12Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /nodes/{nodeId}/commands/stream:
    get:
      tags:
      - Actuator Commands
      summary: Subscribe to command events for a node (SSE)
      description: |
        Opens an SSE stream with command events sent to the specified node. Records are ordered by `createdAt` and MongoDB ObjectId. An explicit `since` includes records at that timestamp and takes priority over `Last-Event-ID`; otherwise a retained event is excluded while later records at the same timestamp are delivered. If the retained event is unavailable, resume falls back to the ObjectId timestamp and is at-least-once.
      security:
      - bearerIndigo: []
      parameters:
      - $ref: '#/components/parameters/LastEventId'
      - $ref: '#/components/parameters/NodeId'
      - name: since
        in: query
        required: false
        description: Emit command events created at or after this timestamp.
        schema:
          type: string
          format: date-time
      - name: pollMs
        in: query
        required: false
        schema:
          type: integer
          default: 1000
          minimum: 250
      responses:
        '200':
          description: SSE stream opened.
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: node-command
                  id: 67e0...
                  data: {"nodeId":"node_ab12cd34ef","commandType":"setState","state":"on","issuedBy":"owner-a","timestamp":"2026-03-23T10:00:00Z"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: SSE worker pool saturated; retry with backoff.
  /credentials/enroll/code:
    post:
      tags:
      - Enrollment & Device Credentials
      summary: Create one-time enrollment code for a node or a list of nodes
      description: |
        Generates a one-time pairing code (short TTL) to bootstrap a device in the field.
      security:
      - bearerIndigo: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsEnrollmentCreateRequest'
            example:
              ttlSeconds: 3600
              replaceOld: false
              graceSeconds: 300
              nodesId:
              - node_ab12cd34ef
              - node_7k2m9q4x1p
      responses:
        '201':
          description: Enrollment code(s) created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialsEnrollmentCreateResponse'
        '400':
          description: Invalid request (e.g., nodesId empty, ttlSeconds out of range).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                invalidPayload:
                  summary: Invalid nodesId list
                  value:
                    type: urn:artemis:error:validation
                    title: Validation error
                    status: 400
                    detail: nodesId must contain at least 1 item and at most 100 items.
                    errorCode: VALIDATION_ERROR
                    correlationId: '0102030405060708'
        '401':
          description: Missing or invalid JWT.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    type: urn:artemis:error:auth:unauthorized
                    title: Unauthorized
                    status: 401
                    detail: Authentication is required.
                    errorCode: AUTH_UNAUTHORIZED
                    correlationId: '1111222233334444'
        '403':
          description: Authenticated but not allowed (e.g., user lacks permission
            to enroll for node(s)).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                forbidden:
                  summary: Forbidden
                  value:
                    type: urn:artemis:error:auth:forbidden
                    title: Forbidden
                    status: 403
                    detail: You do not have permission to create enrollments for one
                      or more nodes.
                    errorCode: AUTH_FORBIDDEN
                    correlationId: '5555666677778888'
        '409':
          description: Conflict (e.g., enrollment already exists and replaceOld=false).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                enrollmentExists:
                  summary: Enrollment already exists
                  value:
                    type: urn:artemis:error:credentials:enrollment-exists
                    title: Enrollment already exists
                    status: 409
                    detail: An active enrollment already exists for one or more nodes.
                    errorCode: CREDENTIALS_ENROLLMENT_EXISTS
                    correlationId: 9999aaaabbbbcccc
  /credentials/enroll:
    post:
      tags:
      - Enrollment & Device Credentials
      summary: Device bootstrap credentials enrollment
      description: |
        Public bootstrap endpoint protected by a one-time enrollmentCode. The service consumes the enrollment, resolves the bound nodeId server-side, generates a short-lived private key and client certificate, and returns them to the device.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsEnrollRequest'
      responses:
        '201':
          description: Certificate issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialsCertificateResponse'
              example:
                nodeId: node_ab12cd34ef
                privateKeyPem: <device-private-key-returned-only-at-enrollment>
                certificatePem: |
                  -----BEGIN CERTIFICATE-----
                  MIIC...snip...AB
                  -----END CERTIFICATE-----
                certificateChainPem: |
                  -----BEGIN CERTIFICATE-----
                  MIIC...snip...CA
                  -----END CERTIFICATE-----
                  -----BEGIN CERTIFICATE-----
                  MIIC...snip...ROOT
                  -----END CERTIFICATE-----
                expiresAt: '2026-12-17T10:15:00Z'
        '400':
          description: Invalid request (e.g., missing enrollmentCode or enrollment
            not found).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                invalidPayload:
                  summary: enrollmentCode is required
                  value:
                    type: urn:artemis:error:validation
                    title: Validation error
                    status: 400
                    detail: enrollmentCode must not be blank
                    errorCode: VALIDATION_ERROR
                    correlationId: c2f6b1b0c1a44b4c
                enrollmentNotFound:
                  summary: Enrollment code not found
                  value:
                    type: urn:artemis:error:400
                    title: Bad Request
                    status: 400
                    detail: Enrollment not found for code
                    errorCode: HTTP_400
                    correlationId: f0e1d2c3b4a59687
        '403':
          description: Enrollment code is expired or already used.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                codeExpired:
                  summary: Enrollment code expired
                  value:
                    type: urn:artemis:error:credentials:enrollment-expired
                    title: Enrollment expired
                    status: 403
                    detail: The enrollmentCode has expired.
                    errorCode: CREDENTIALS_ENROLLMENT_EXPIRED
                    correlationId: 8f3b9a2d4c1a4d11
                codeUsed:
                  summary: Code already used
                  value:
                    type: urn:artemis:error:credentials:enrollment-used
                    title: Enrollment already used
                    status: 403
                    detail: The enrollmentCode has already been used.
                    errorCode: CREDENTIALS_ENROLLMENT_USED
                    correlationId: a0b1c2d3e4f50607
                    nodeId: node_ab12cd34ef
                    enrollmentId: enr_2f5c8c0b
        '409':
          description: Conflict (e.g., certificate already exists and replaceOld=false).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                certAlreadyExists:
                  summary: Node already has a valid certificate
                  value:
                    type: urn:artemis:error:credentials:certificate-exists
                    title: Certificate already exists
                    status: 409
                    detail: A valid certificate already exists for this nodeId.
                    errorCode: CREDENTIALS_CERT_ALREADY_EXISTS
                    correlationId: f1e2d3c4b5a69788
                    nodeId: node_ab12cd34ef
  /credentials/renew:
    post:
      tags:
      - Enrollment & Device Credentials
      summary: Renew device certificate
      description: |
        The device presents its previous certificate and a CSR signed with the corresponding private key.
        Docker/cloud deployments require csrPem as proof-of-possession and return the renewed certificate
        without a private key. Local development may explicitly disable proof-of-possession and use the
        simplified server-generated-key flow.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRenewRequest'
      responses:
        '201':
          description: New certificate issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialsCertificateResponse'
              example:
                nodeId: node_ab12cd34ef
                privateKeyPem: null
                certificatePem: |
                  -----BEGIN CERTIFICATE-----
                  MIIC...snip...AB
                  -----END CERTIFICATE-----
                certificateChainPem: |
                  -----BEGIN CERTIFICATE-----
                  MIIC...snip...CA
                  -----END CERTIFICATE-----
                  -----BEGIN CERTIFICATE-----
                  MIIC...snip...ROOT
                  -----END CERTIFICATE-----
                expiresAt: '2027-12-17T10:15:00Z'
        '400':
          description: Invalid request (e.g., malformed or unreadable previous certificate).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                invalidCertificate:
                  summary: previousCertificatePem is invalid
                  value:
                    type: urn:artemis:error:validation
                    title: Bad Request
                    status: 400
                    detail: Invalid previousCertificatePem
                    errorCode: HTTP_400
                    correlationId: d3f0a1b2c3d4e5f6
        '401':
          description: Missing or invalid authentication context.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    type: urn:artemis:error:auth:unauthorized
                    title: Unauthorized
                    status: 401
                    detail: Authentication is required.
                    errorCode: AUTH_UNAUTHORIZED
                    correlationId: 0a1b2c3d4e5f6071
        '403':
          description: Authenticated but not allowed (e.g., certificate identity not
            mapped to a node).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                unknownDeviceIdentity:
                  summary: Certificate identity not recognized
                  value:
                    type: urn:artemis:error:auth:unknown-device
                    title: Unknown device identity
                    status: 403
                    detail: The client certificate identity is not associated with
                      any registered node.
                    errorCode: AUTH_UNKNOWN_DEVICE
                    correlationId: '1122334455667788'
        '409':
          description: Conflict (e.g., renewal not allowed yet, grace window, policy
            violation).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                renewalNotAllowedYet:
                  summary: Renewal too early
                  value:
                    type: urn:artemis:error:credentials:renewal-too-early
                    title: Renewal not allowed yet
                    status: 409
                    detail: Renewal is not allowed yet for this node. Try later.
                    errorCode: CREDENTIALS_RENEWAL_TOO_EARLY
                    correlationId: 99aabbccddeeff00
        '429':
          description: Too many requests (rate limited).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                rateLimited:
                  summary: Rate limit exceeded
                  value:
                    type: urn:artemis:error:rate-limit
                    title: Too many requests
                    status: 429
                    detail: Too many renewal attempts. Please retry later.
                    errorCode: RATE_LIMITED
                    correlationId: aa00bb11cc22dd33
  /api:
    servers:
    - url: /
    get:
      tags:
      - Discovery
      operationId: getApiDiscovery
      summary: API Discovery document
      description: |
        Discovery document for the current v1 API, authentication metadata,
        release documentation links, and URI templates. The representation is
        cacheable for five minutes and uses a weak, payload-derived ETag.
      security: []
      parameters:
      - name: If-None-Match
        in: header
        required: false
        description: Weak ETag previously returned by this discovery resource.
        schema:
          type: string
      responses:
        '200':
          description: Discovery document.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - public, max-age=300
              example: public, max-age=300
            ETag:
              schema:
                type: string
                pattern: ^W/"[0-9a-f]{64}"$
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryDocument'
              examples:
                default:
                  value:
                    name: ARTEMIS Platform API
                    description: API for managing digital twins, nodes, and IoT data.
                    status: active
                    apiVersion: v1
                    specVersion: 2.0.2
                    versions:
                    - version: v1
                      status: current
                      path: /api/v1/iot
                    authentication:
                      scheme: bearer
                      bearerFormat: JWT
                      issuer: https://chnet-iam.cloud.cnaf.infn.it/
                      audience: artemis-api
                      scopeEnforcement:
                        deploymentAware: true
                        requested: true
                        enabled: true
                    links:
                      self:
                        href: /api
                      api:
                        href: /api/v1/iot
                      health:
                        href: /health
                      openapi:
                        href: https://example.invalid/openapi.yaml
                      documentation:
                        href: https://example.invalid/docs
                    resourceTemplates:
                      node:
                        href: /api/v1/iot/nodes/{nodeId}
                        variables:
                        - nodeId
                      nodeData:
                        href: /api/v1/iot/nodes/{nodeId}/data
                        variables:
                        - nodeId
                      media:
                        href: /api/v1/iot/media/{mediaId}
                        variables:
                        - mediaId
                      commands:
                        href: /api/v1/iot/nodes/{nodeId}/commands
                        variables:
                        - nodeId
                      decisionRule:
                        href: /api/v1/iot/decision-rules/{ruleId}
                        variables:
                        - ruleId
        '304':
          description: The current representation matches `If-None-Match`; no response
            body is returned.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - public, max-age=300
              example: public, max-age=300
            ETag:
              schema:
                type: string
                pattern: ^W/"[0-9a-f]{64}"$
components:
  securitySchemes:
    bearerIndigo:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        OIDC access token issued by INDIGO IAM. Tokens must contain the configured API audience (`artemis-api` on the CNAF deployment). Enforcement of `artemis.iot.*` scopes is deployment-dependent; it is disabled on the CNAF demo until IAM allows those scopes for the client.
  parameters:
    NodeId:
      name: nodeId
      in: path
      required: true
      schema:
        type: string
      description: Unique ID of the node (sensor or actuator).
    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
      description: Unique ID of the decision rule.
    MediaId:
      name: mediaId
      in: path
      required: true
      description: Unique media identifier.
      schema:
        type: string
    ExportId:
      name: exportId
      in: path
      required: true
      description: Media export job identifier.
      schema:
        type: string
    PageLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of records returned in a page.
      schema:
        type: integer
        default: 500
        minimum: 1
        maximum: 1000
    PageOffset:
      name: offset
      in: query
      required: false
      description: Number of records skipped before collecting the response page.
      schema:
        type: integer
        default: 0
        minimum: 0
    ActuatorNameFilter:
      name: actuatorName
      in: query
      required: false
      description: |
        Restricts the lookup to the last command issued for the given actuator of the node. When omitted the most recent command of the node is returned, whatever the actuator.
      schema:
        type: string
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: |
        Identifier of the last event received by the client. An explicit `since` query parameter takes priority. When retained, that exact event is excluded on resume; if it is unavailable, resume is at-least-once. Sent automatically by the browser EventSource on reconnection.
      schema:
        type: string
  schemas:
    StatusNodeValue:
      type: string
      enum:
      - active
      - inactive
      - standby
    Timestamp:
      type: string
      format: date-time
      example: '2025-09-10T10:15:12Z'
    NullableTimestamp:
      type: string
      format: date-time
      nullable: true
      description: Timestamp when supplied or recorded; otherwise null.
    NullableStatusNodeValue:
      type: string
      nullable: true
      enum:
      - active
      - inactive
      - standby
      - null
      description: Node status may be null when it has not been supplied or recorded.
    NodeCapabilities:
      type: object
      properties:
        sensors:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/NodeSensorCapability'
        actuators:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/NodeActuatorCapability'
        supportedDataTypes:
          type: array
          nullable: true
          items:
            type: string
            enum:
            - scalar
            - vector
            - spatial
            - multimedia
            - temporal
        mqttTopics:
          type: object
          description: Server-assigned MQTT topics materialized on the node after
            registration.
          readOnly: true
          properties:
            publish:
              type: array
              items:
                type: string
            subscribe:
              type: array
              items:
                type: string
    NodeCapabilitiesInput:
      type: object
      nullable: true
      properties:
        sensors:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/NodeSensorCapability'
        actuators:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/NodeActuatorCapability'
        supportedDataTypes:
          type: array
          nullable: true
          items:
            type: string
            enum:
            - scalar
            - vector
            - spatial
            - multimedia
            - temporal
    NodeSensorCapability:
      type: object
      properties:
        sensorId:
          type: string
          nullable: true
          description: Stable identifier of the sensor within the node.
        name:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        dataType:
          type: string
          nullable: true
          enum:
          - scalar
          - vector
          - spatial
          - multimedia
          - temporal
          - null
        unit:
          type: string
          nullable: true
        range:
          type: array
          nullable: true
          minItems: 2
          maxItems: 2
          items:
            type: number
    NodeActuatorCapability:
      type: object
      properties:
        name:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        supportedCommands:
          type: array
          nullable: true
          description: Abstract commands supported by the actuator.
          items:
            $ref: '#/components/schemas/CommandType'
    NodeOperationalFlags:
      type: object
      nullable: true
      properties:
        isCalibrated:
          type: boolean
          nullable: true
          default: true
        maintenanceRequired:
          type: boolean
          nullable: true
          default: false
        manualOverrideActive:
          type: boolean
          nullable: true
          default: false
        manualOverrideBy:
          type: string
          nullable: true
        manualOverrideAt:
          $ref: '#/components/schemas/NullableTimestamp'
    NodeDetails:
      type: object
      required:
      - nodeId
      - name
      - type
      - capabilities
      - status
      - enabled
      - simulatedNode
      properties:
        nodeId:
          type: string
          description: Unique ID of the node.
          example: node_ab12cd34ef
        name:
          type: string
          description: Descriptive name of the node.
        owner:
          type: string
          description: Owner of the node.
        type:
          type: string
          enum:
          - sensor
          - actuator
          - hybrid
          description: Type of node.
        location:
          type: object
          nullable: true
          description: Location data of the node.
          required:
          - indoor
          - installationPoint
          properties:
            latitude:
              type: number
              nullable: true
            longitude:
              type: number
              nullable: true
            altitude:
              type: number
              nullable: true
            position:
              type: object
              nullable: true
              properties:
                floor:
                  type: integer
                  nullable: true
                room:
                  type: string
                  nullable: true
                x:
                  type: integer
                  nullable: true
                y:
                  type: integer
                  nullable: true
                z:
                  type: integer
                  nullable: true
            indoor:
              type: boolean
            installationPoint:
              type: string
        capabilities:
          $ref: '#/components/schemas/NodeCapabilities'
        rhdtId:
          type: string
          nullable: true
          example: rhdt-001
        status:
          $ref: '#/components/schemas/NullableStatusNodeValue'
        enabled:
          type: boolean
          nullable: true
          description: Legacy null is treated as enabled.
        simulatedNode:
          type: boolean
          nullable: true
        manufacturer:
          type: string
          nullable: true
        firmwareVersion:
          type: string
          nullable: true
        installationTimestamp:
          $ref: '#/components/schemas/NullableTimestamp'
        registrationTimestamp:
          $ref: '#/components/schemas/NullableTimestamp'
        operationalFlags:
          $ref: '#/components/schemas/NodeOperationalFlags'
        additionalProp:
          type: object
          nullable: true
    NodeDetailsRequest:
      type: object
      required:
      - name
      - type
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          pattern: \S
          description: Non-blank descriptive name of the node.
        owner:
          type: string
          nullable: true
          description: Owner identity is assigned from the caller context.
        type:
          type: string
          enum:
          - sensor
          - actuator
          - hybrid
          description: Type of node.
        location:
          type: object
          nullable: true
          description: Location data of the node.
          required:
          - indoor
          - installationPoint
          properties:
            latitude:
              type: number
              nullable: true
            longitude:
              type: number
              nullable: true
            altitude:
              type: number
              nullable: true
            position:
              type: object
              nullable: true
              properties:
                floor:
                  type: integer
                  nullable: true
                room:
                  type: string
                  nullable: true
                x:
                  type: integer
                  nullable: true
                y:
                  type: integer
                  nullable: true
                z:
                  type: integer
                  nullable: true
            indoor:
              type: boolean
            installationPoint:
              type: string
        capabilities:
          $ref: '#/components/schemas/NodeCapabilitiesInput'
        rhdtId:
          type: string
          nullable: true
          example: rhdt-001
        status:
          $ref: '#/components/schemas/NullableStatusNodeValue'
        enabled:
          type: boolean
          nullable: true
          default: true
          description: Missing or null is normalized to true at registration.
        simulatedNode:
          type: boolean
          nullable: true
        manufacturer:
          type: string
          nullable: true
        firmwareVersion:
          type: string
          nullable: true
        installationTimestamp:
          $ref: '#/components/schemas/NullableTimestamp'
        operationalFlags:
          $ref: '#/components/schemas/NodeOperationalFlags'
        additionalProp:
          type: object
          nullable: true
    NodeUpdateCommand:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: New descriptive name of the node.
        type:
          type: string
          enum:
          - sensor
          - actuator
          - hybrid
          description: Updated type of node.
        location:
          type: object
          description: Updated location data of the node.
          required:
          - indoor
          - installationPoint
          properties:
            latitude:
              type: number
            longitude:
              type: number
            altitude:
              type: number
            position:
              type: object
              properties:
                floor:
                  type: integer
                room:
                  type: string
                x:
                  type: integer
                y:
                  type: integer
                z:
                  type: integer
            indoor:
              type: boolean
            installationPoint:
              type: string
        enabled:
          type: boolean
        simulatedNode:
          type: boolean
        operationalFlags:
          $ref: '#/components/schemas/NodeOperationalFlags'
        additionalProp:
          type: object
    UpdateNodeInformationRequest:
      type: object
      required:
      - node
      additionalProperties: false
      properties:
        description:
          type: string
          description: The reason why the node is being updated.
          example: Room change
        node:
          $ref: '#/components/schemas/NodeUpdateCommand'
    ManualOverrideRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          description: Reason attached to the manual override audit event.
          example: manual command
    ManualOverrideAck:
      type: object
      properties:
        nodeId:
          type: string
        message:
          type: string
          example: manual-override-activated
      required:
      - nodeId
      - message
    NodeResponse:
      type: object
      properties:
        nodeId:
          type: string
        message:
          type: string
    NodeRegisteredResponse:
      type: object
      required:
      - nodeId
      - message
      - assignedTopics
      properties:
        nodeId:
          type: string
          description: Unique ID of the node.
          example: node_ab12cd34ef
        message:
          type: string
          example: created
        assignedTopics:
          $ref: '#/components/schemas/AssignedTopics'
    AssignedTopics:
      type: object
      required:
      - publish
      - subscribe
      description: MQTT topics automatically assigned by node-service at registration
