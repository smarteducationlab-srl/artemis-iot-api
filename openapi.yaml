        status:
          $ref: '#/components/schemas/StatusNodeValue'
        batteryLevel:
          type: integer
        signalStrength:
          type: integer
        temperature:
          type: number
    HeartbeatBasic:
      type: object
      properties:
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        status:
          $ref: '#/components/schemas/StatusNodeValue'
        batteryLevel:
          type: integer
        signalStrength:
          type: integer
        temperature:
          type: number
    HeartbeatListResponse:
      type: object
