    CommandType:
      type: string
      description: The abstract command to be executed.
      enum:
      - setState
      - setValue
    NullableCommandType:
      type: string
      nullable: true
      enum:
      - setState
      - setValue
      - null
      description: Null only when a structured payload supplies the command.
    Commands:
      type: object
      required:
      - actuatorName
      properties:
        issuedBy:
          type: string
          example: user-0001
        actuatorName:
          type: string
          minLength: 1
          description: Logical actuator name on the target node.
          example: ventilation-fan
        commandType:
          $ref: '#/components/schemas/NullableCommandType'
        state:
          type: string
          nullable: true
          enum:
          - on
          - off
          - null
          description: Only used if commandType is setState
          example: on
        value:
          type: number
          nullable: true
          description: Only used if commandType is setValue
          minimum: 0
          maximum: 100
          example: 75
        unit:
          type: string
          nullable: true
          example: '%'
        payload:
          type: object
          nullable: true
          description: Optional structured command payload. May be used without commandType
            when non-empty.
          minProperties: 1
          additionalProperties: true
        reason:
          type: string
          nullable: true
          example: Partial activation due to ventilation regulation
        message:
          type: string
          example: Command delivered
        timestamp:
          $ref: '#/components/schemas/Timestamp'
      anyOf:
      - required:
        - commandType
        - state
        properties:
          commandType:
            type: string
            enum:
            - setState
          state:
            type: string
            enum:
            - on
            - off
          value:
            type: number
            nullable: true
            enum:
            - null
      - required:
        - commandType
        - value
        properties:
          commandType:
            type: string
            enum:
            - setValue
          value:
            type: number
            minimum: 0
            maximum: 100
          state:
            type: string
            nullable: true
            enum:
            - null
      - required:
        - payload
        properties:
          payload:
            type: object
            minProperties: 1
          commandType:
            type: string
            nullable: true
            enum:
            - null
    CommandsRequest:
      type: object
