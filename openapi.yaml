        batteryLevel:
          type: integer
        signalStrength:
          type: integer
        temperature:
          type: number
        timestamp:
          $ref: '#/components/schemas/Timestamp'
      required:
      - status
    HeartbeatAck:
      type: object
      properties:
        status:
          type: string
          example: ok
        id:
          type: string
