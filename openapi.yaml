          type: array
          items:
            $ref: '#/components/schemas/NodeDetails'
    NodeRegistrationHistoryResponse:
      type: object
      properties:
        history:
          type: array
          items:
            $ref: '#/components/schemas/NodeHistory'
    Heartbeat:
      type: object
