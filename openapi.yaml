          enum:
          - v1
        status:
          type: string
          description: Version status.
          enum:
          - current
          example: current
        path:
          type: string
          enum:
          - /api/v1/iot
    DiscoveryScopeEnforcement:
      type: object
      required:
      - deploymentAware
      - requested
      - enabled
      additionalProperties: false
      properties:
        deploymentAware:
          type: boolean
          enum:
          - true
          description: |
            Sempre `true`: il gateway espone lo stato effettivo dell'enforcement invece di assumere una configurazione.
        requested:
          type: boolean
          description: |
            Valore configurato di `artemis.security.scope-enforcement-enabled`. Puo' essere `true` anche quando l'enforcement effettivo e' disattivato dall'API pubblica.
        enabled:
          type: boolean
          description: |
            Enforcement effettivo: `requested && !public-api-enabled`. Quando `public-api-enabled=true` l'accesso anonimo e' registrato prima delle regole scope, quindi `enabled` resta `false` anche con `requested=true`.
    DiscoveryAuthentication:
      type: object
      required:
      - scheme
      - bearerFormat
      - issuer
      - audience
      - scopeEnforcement
      additionalProperties: false
      properties:
        scheme:
          type: string
          enum:
          - bearer
        bearerFormat:
          type: string
          enum:
          - JWT
        issuer:
          type: string
          format: uri
          pattern: ^https://
        audience:
          type: string
          minLength: 1
        scopeEnforcement:
          $ref: '#/components/schemas/DiscoveryScopeEnforcement'
    DiscoveryNodeTemplate:
      type: object
      required:
      - href
      - variables
      additionalProperties: false
      properties:
        href:
          type: string
          enum:
          - /api/v1/iot/nodes/{nodeId}
        variables:
          type: array
          minItems: 1
          maxItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - nodeId
    DiscoveryNodeDataTemplate:
      type: object
      required:
      - href
      - variables
      additionalProperties: false
      properties:
        href:
          type: string
          enum:
          - /api/v1/iot/nodes/{nodeId}/data
        variables:
          type: array
          minItems: 1
          maxItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - nodeId
    DiscoveryMediaTemplate:
      type: object
      required:
      - href
      - variables
      additionalProperties: false
      properties:
        href:
          type: string
          enum:
          - /api/v1/iot/media/{mediaId}
        variables:
          type: array
          minItems: 1
          maxItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - mediaId
    DiscoveryCommandsTemplate:
      type: object
      required:
      - href
      - variables
      additionalProperties: false
      properties:
        href:
          type: string
          enum:
          - /api/v1/iot/nodes/{nodeId}/commands
        variables:
          type: array
          minItems: 1
          maxItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - nodeId
    DiscoveryDecisionRuleTemplate:
      type: object
      required:
      - href
      - variables
      additionalProperties: false
      properties:
        href:
          type: string
          enum:
          - /api/v1/iot/decision-rules/{ruleId}
        variables:
          type: array
          minItems: 1
          maxItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - ruleId
    DiscoveryDocument:
      type: object
      required:
      - name
      - description
      - status
      - apiVersion
      - specVersion
      - versions
      - authentication
      - links
      - resourceTemplates
      additionalProperties: false
      properties:
        name:
          type: string
          enum:
          - ARTEMIS Platform API
        description:
          type: string
          enum:
          - API for managing digital twins, nodes, and IoT data.
        status:
          type: string
          description: Overall platform status.
          enum:
          - active
          example: active
        apiVersion:
          type: string
          enum:
          - v1
        specVersion:
          type: string
          minLength: 1
        versions:
          type: array
          minItems: 1
          maxItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/DiscoveryVersion'
        authentication:
          $ref: '#/components/schemas/DiscoveryAuthentication'
        links:
          type: object
          required:
          - self
          - api
          - health
          - openapi
          - documentation
          additionalProperties: false
          properties:
            self:
              $ref: '#/components/schemas/DiscoverySelfLink'
            api:
              $ref: '#/components/schemas/DiscoveryApiLink'
            health:
              $ref: '#/components/schemas/DiscoveryHealthLink'
            openapi:
              $ref: '#/components/schemas/DiscoveryHttpsLink'
            documentation:
              $ref: '#/components/schemas/DiscoveryHttpsLink'
        resourceTemplates:
          type: object
          required:
          - node
          - nodeData
          - media
          - commands
          - decisionRule
          additionalProperties: false
          properties:
            node:
              $ref: '#/components/schemas/DiscoveryNodeTemplate'
            nodeData:
              $ref: '#/components/schemas/DiscoveryNodeDataTemplate'
            media:
              $ref: '#/components/schemas/DiscoveryMediaTemplate'
            commands:
              $ref: '#/components/schemas/DiscoveryCommandsTemplate'
            decisionRule:
              $ref: '#/components/schemas/DiscoveryDecisionRuleTemplate'
    CredentialsEnrollmentCreateRequest:
      type: object
      required:
      - nodesId
      additionalProperties: false
      properties:
        ttlSeconds:
          type: integer
          format: int32
          minimum: 3600
          maximum: 864000
          description: Code validity in seconds.
        replaceOld:
          type: boolean
        graceSeconds:
          type: integer
          format: int32
          minimum: 0
        nodesId:
          type: array
          description: List of nodeId for which a enrollment code (for each nodeId)
            is requested, max 100 nodes per request
          maxItems: 100
          example:
          - node_ab12cd34ef
          - node_7k2m9q4x1p
          - node_m4z8c1q2wr
          items:
            type: string
    CredentialsEnrollmentCreateResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        enrollments:
          type: array
          items:
            type: object
            properties:
              nodeId:
                type: string
              enrollmentId:
                type: string
              enrollmentCode:
                type: string
                description: One-time code (shown once)
      example:
        createdAt: '2025-12-17T10:15:00Z'
        expiresAt: '2025-12-17T10:45:00Z'
        enrollments:
        - nodeId: node_ab12cd34ef
          enrollmentId: enr_2f5c8c0b
          enrollmentCode: K4R9-3Q1Z-7P8M
        - nodeId: node_7k2m9q4x1p
          enrollmentId: enr_8a0d1c77
          enrollmentCode: A1B2-C3D4-E5F6
    CredentialsEnrollRequest:
      type: object
      required:
      - enrollmentCode
      additionalProperties: false
      properties:
        enrollmentCode:
          type: string
          description: One-time bootstrap enrollment code issued by `/credentials/enroll/code`
      example:
        enrollmentCode: K4R9-3Q1Z-7P8M
    CredentialsCertificateResponse:
      type: object
      required:
      - nodeId
      - certificatePem
      - certificateChainPem
      - expiresAt
      properties:
        nodeId:
          type: string
        privateKeyPem:
          type: string
          nullable: true
          description: |
            Device private key in PEM format.
            Returned during bootstrap enrollment and only renewal flows that explicitly
            disable proof-of-possession. Cloud renewal with proof-of-possession returns null.
        certificatePem:
          type: string
          description: Client certificate in PEM format
        certificateChainPem:
          type: string
          description: Certificate chain (including issuing CA) in PEM format
        expiresAt:
          type: string
          format: date-time
      example:
        nodeId: node_ab12cd34ef
        privateKeyPem: <device-private-key-returned-only-at-enrollment>
        certificatePem: |
          -----BEGIN CERTIFICATE-----
          MIIC...snip...AB
          -----END CERTIFICATE-----
        certificateChainPem: |
          -----BEGIN CERTIFICATE-----
          MIIC...snip...CA
          -----END CERTIFICATE-----
          -----BEGIN CERTIFICATE-----
          MIIC...snip...ROOT
          -----END CERTIFICATE-----
        expiresAt: '2026-12-17T10:15:00Z'
    CredentialsRenewRequest:
      type: object
      required:
      - previousCertificatePem
      additionalProperties: false
      properties:
        previousCertificatePem:
          type: string
          description: Previously issued client certificate in PEM format
        csrPem:
          type: string
          description: |
            PKCS#10 CSR in PEM format, signed with the private key matching the previous certificate. Required by Docker/cloud deployments where proof-of-possession is enabled.
      example:
        previousCertificatePem: |
          -----BEGIN CERTIFICATE-----
          MIIC...snip...AB
          -----END CERTIFICATE-----
        csrPem: |
          -----BEGIN CERTIFICATE REQUEST-----
          MIIB...snip...AB
          -----END CERTIFICATE REQUEST-----
    ProblemDetails:
      type: object
      additionalProperties: true
      required:
      - type
      - title
      - status
      - timestamp
      properties:
        type:
          type: string
          format: uri
          description: Machine-readable error type URI
        title:
          type: string
          description: Short, human-readable summary
        status:
          type: integer
          format: int32
        detail:
          type: string
          description: Human-readable explanation
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying the specific occurrence
        errorCode:
          type: string
          description: Stable application error code
        timestamp:
          type: string
          format: date-time
          description: Error occurrence timestamp
  responses:
    BadRequest:
      description: Invalid request (e.g., missing/invalid `type` for submit/query,
        invalid content type).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Authenticated but not permitted to access this resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Resource not found (e.g., node or media).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Conflict (e.g., duplicate detected when using idempotency/checksum).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unprocessable:
      description: Invalid or missing required parameters/body fields.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServerError:
      description: Server error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServiceUnavailable:
      description: Service overloaded or temporarily unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
