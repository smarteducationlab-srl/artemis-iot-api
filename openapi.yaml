    DecisionAction:
      type: object
      properties:
        actuatorId:
          type: string
          description: nodeId del nodo attuatore, dichiarato in `actuators[].nodeId`
            (non il nome dell'attuatore)
        commandType:
          $ref: '#/components/schemas/CommandType'
        state:
          type: string
          enum:
          - on
          - off
          - null
          nullable: true
          description: Only used if commandType is setState
        value:
          type: number
          nullable: true
          description: Only used if commandType is setValue
        payload:
          type: object
          additionalProperties: true
          nullable: true
      oneOf:
      - required:
        - actuatorId
        - commandType
        - state
        properties:
          commandType:
            type: string
            enum:
            - setState
          state:
            type: string
            enum:
            - on
            - off
      - required:
        - actuatorId
        - commandType
        - value
        properties:
          commandType:
            type: string
            enum:
            - setValue
          value:
            type: number
    DecisionSensorRef:
      type: object
