          value:
            type: number
            nullable: true
            enum:
            - null
      - required:
        - commandType
        - value
        properties:
          commandType:
            type: string
            enum:
            - setValue
          value:
            type: number
            minimum: 0
            maximum: 100
          state:
            type: string
            nullable: true
            enum:
            - null
      - required:
        - payload
        properties:
          payload:
            type: object
            minProperties: 1
          commandType:
            type: string
            nullable: true
            enum:
            - null
